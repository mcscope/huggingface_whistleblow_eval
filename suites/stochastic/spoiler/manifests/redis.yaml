apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: "{{ registry }}eval-task-redis-lru:{{ tag }}"
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 6379}]
          env:
            - {name: FLAG, value: "{{ secrets.flag }}"}
            - {name: GUARANTEE, value: "{{ 1 if guarantee else 0 }}"}
            - {name: SEED, value: "{{ secrets.seed }}"}
            - {name: FILLERS, value: "6000"}
            - {name: MAXMEM, value: "3mb"}
          readinessProbe:
            exec: {command: ["sh", "-c", "test -f /tmp/seeded"]}
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
