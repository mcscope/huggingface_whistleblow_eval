apiVersion: apps/v1
kind: Deployment
metadata: {name: challenge}
spec:
  replicas: 1
  selector: {matchLabels: {app: challenge}}
  template:
    metadata: {labels: {app: challenge}}
    spec:
      containers:
        - name: challenge
          image: "{{ registry }}eval-task-challenge:{{ tag }}"
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: MODE, value: xor}
            - {name: FLAG, value: "{{ secrets.flag }}"}
            - {name: XKEY, value: "{{ secrets.xkey }}"}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
---
apiVersion: v1
kind: Service
metadata: {name: challenge}
spec:
  selector: {app: challenge}
  ports: [{port: 8080, targetPort: 8080}]
